<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okey Turnuva</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
h2{margin:0;padding:10px;background:#1c1c1c}

.top{padding:10px;background:#1c1c1c}

.container{padding:10px}

.card{
background:#1b1b1b;
padding:10px;
margin:8px 0;
border-radius:10px;
}

input{padding:8px;margin:3px;width:60%}
button{padding:6px;margin:3px;border:0;border-radius:6px}

.add{background:#28a745;color:#fff}
.next{background:#007bff;color:#fff;width:100%}
.reset{background:red;color:#fff;width:100%}

.name{font-size:18px;font-weight:bold}
.total{font-size:20px;float:right}

.history{margin-top:6px;font-size:12px;color:#aaa}

.badge{
display:inline-block;
padding:3px 6px;
margin:2px;
border-radius:5px;
background:#333;
}

.lock{
opacity:0.5;
}

.win{
text-align:center;
font-size:22px;
color:#ffd700;
margin:10px;
}
</style>

</head>

<body>

<h2>🎲 Okey Turnuva Sistemi</h2>

<div class="top">
Toplam Tur:
<input id="max" type="number" value="5" style="width:60px">
<button onclick="setMax()">Ayarla</button>

<br><br>
Tur: <span id="round">1</span> / <span id="maxShow">5</span>
</div>

<div class="container">

<input id="name" placeholder="Oyuncu adı">
<button class="add" onclick="add()">Ekle</button>

<div id="winner"></div>
<div id="list"></div>

<button class="next" onclick="nextRound()">▶ Tur Bitti</button>
<button class="reset" onclick="reset()">Sıfırla</button>

</div>

<script>

let players=[];
let round=1;
let maxRound=5;
let locked=false;

function setMax(){
maxRound=parseInt(document.getElementById("max").value||5);
render();
}

function add(){
if(locked)return;

let n=document.getElementById("name").value.trim();
if(!n)return;

players.push({
name:n,
score:0,
history:[]
});

document.getElementById("name").value="";
render();
}

function addScore(i){
if(locked)return;

let v=parseInt(prompt("Puan (+/-):"));
if(isNaN(v))return;

players[i].score+=v;
players[i].history.push(v);

render();
}

function editScore(pi,hi){
if(locked)return;

let v=parseInt(prompt("Düzelt:",players[pi].history[hi]));
if(isNaN(v))return;

players[pi].score-=players[pi].history[hi];
players[pi].history[hi]=v;
players[pi].score+=v;

render();
}

function deleteScore(pi,hi){
if(locked)return;

players[pi].score-=players[pi].history[hi];
players[pi].history.splice(hi,1);

render();
}

function nextRound(){

// TUR KAPANIR
locked=true;

// tur bilgisi
if(round>=maxRound){
finishGame();
return;
}

// tur ilerle ama unlock et
setTimeout(()=>{
round++;
locked=false;
render();
},300);

playSound();
}

function finishGame(){

let best=players[0];

for(let i=1;i<players.length;i++){
if(players[i].score < best.score){
best=players[i];
}
}

document.getElementById("winner").innerHTML=
"<div class='win'>🏆 Kazanan: "+best.name+" 🎉</div>";

playSound();
render();
}

function playSound(){

let ctx=new (window.AudioContext||window.webkitAudioContext)();

function t(f,s,d){
let o=ctx.createOscillator();
let g=ctx.createGain();

o.frequency.value=f;
o.type="sine";
g.gain.value=0.1;

o.connect(g);
g.connect(ctx.destination);

o.start(ctx.currentTime+d);
o.stop(ctx.currentTime+d+s);
}

t(523,0.2,0);
t(659,0.2,0.2);
t(784,0.4,0.4);
}

function reset(){
players=[];
round=1;
locked=false;
document.getElementById("winner").innerHTML="";
render();
}

function render(){

document.getElementById("round").innerText=round;
document.getElementById("maxShow").innerText=maxRound;

let html="";

for(let i=0;i<players.length;i++){
let p=players[i];

let hist="";

for(let j=0;j<p.history.length;j++){
let v=p.history[j];

hist +=
"<span class='badge'>"+(v>0?"+":"")+v+
" <button onclick='editScore("+i+","+j+")'>✎</button>"+
" <button onclick='deleteScore("+i+","+j+")'>x</button></span>";
}

html+=
"<div class='card "+(locked?"lock":"")+"'>"+
"<div>"+
"<span class='name'>"+p.name+"</span>"+
"<span class='total'>"+p.score+"</span>"+
"</div>"+
"<button onclick='addScore("+i+")'>Puan Ekle</button>"+
"<div class='history'>"+hist+"</div>"+
"</div>";
}

document.getElementById("list").innerHTML=html;
}

render();

</script>

</body>
</html>
