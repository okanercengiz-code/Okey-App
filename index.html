<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>101 Okey Pro</title>

<style>
body{
margin:0;
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
background:#0b0b0f;
color:#fff;
}

header{
padding:15px;
background:linear-gradient(135deg,#111,#222);
font-size:20px;
font-weight:bold;
}

.container{padding:15px}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter: blur(10px);
padding:15px;
margin:10px 0;
border-radius:15px;
transform:translateY(10px);
opacity:0;
animation:fade 0.3s forwards;
}

@keyframes fade{
to{transform:translateY(0);opacity:1}
}

input,select{
padding:10px;
border-radius:10px;
border:none;
margin:5px;
width:80%;
background:#1a1a1a;
color:#fff;
}

button{
padding:10px;
border:none;
border-radius:10px;
margin:5px;
background:#2d6cdf;
color:#fff;
transition:0.2s;
}

button:active{transform:scale(0.95)}

.small{font-size:12px;color:#aaa}

.badge{
display:inline-block;
padding:3px 8px;
background:#222;
border-radius:8px;
margin:2px;
}

.win{
text-align:center;
font-size:22px;
color:#00ff9d;
margin:10px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}
</style>
</head>

<body>

<header>🎲 101 Okey PRO</header>

<div class="container">

<div class="card">

<input id="name" placeholder="Oyuncu adı">
<button onclick="addPlayer()">Ekle</button>

</div>

<div class="card">
Tur: <span id="round">1</span>

<button onclick="nextRound()">Tur Bitir</button>
<button onclick="reset()">Reset</button>
</div>

<div id="winner"></div>

<div id="list"></div>

</div>

<script>

let players=[];
let round=1;

function addPlayer(){
let n=document.getElementById("name").value.trim();
if(!n)return;

players.push({
name:n,
score:0,
opened:false,
history:[]
});

document.getElementById("name").value="";
render();
}

function openHand(i){
if(players[i].score < 101){
alert("101 olmadan açamazsın!");
return;
}
players[i].opened=true;
render();
}

function addScore(i){

let v=parseInt(prompt("Puan (+/-):"));
if(isNaN(v))return;

// açmadıysa ceza çarpanı
if(!players[i].opened){
v = v * 2;
}

players[i].score += v;
players[i].history.push(v);

render();
}

function nextRound(){
round++;
render();
}

function reset(){
players=[];
round=1;
document.getElementById("winner").innerHTML="";
render();
}

function finish(){

let best=players[0];

for(let i=1;i<players.length;i++){
if(players[i].score < best.score){
best=players[i];
}
}

document.getElementById("winner").innerHTML=
"<div class='win'>🏆 Kazanan: "+best.name+"</div>";
}

function render(){

players.sort((a,b)=>a.score-b.score);

let html="";

players.forEach((p,i)=>{

let hist="";

p.history.forEach(h=>{
hist += "<span class='badge'>"+h+"</span>";
});

html+=`
<div class="card">
<div style="display:flex;justify-content:space-between">
<b>${p.name}</b>
<span>${p.score}</span>
</div>

<div class="small">
${p.opened ? "AÇIK ✔" : "AÇMADI ❌"}
</div>

<button onclick="addScore(${i})">Puan</button>
<button onclick="openHand(${i})">Aç</button>

<div class="small">${hist}</div>
</div>`;
});

document.getElementById("list").innerHTML=html;
document.getElementById("round").innerText=round;
}

render();

</script>

</body>
</html>
