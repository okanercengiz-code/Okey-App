<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okey Skor</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#fff;
}

header{
padding:12px;
background:#1c1c1c;
font-size:18px;
font-weight:bold;
}

.top{
padding:10px;
background:#1c1c1c;
}

.container{
padding:10px;
}

input{
padding:8px;
width:60%;
margin:5px;
}

button{
padding:8px;
margin:5px;
border:0;
border-radius:6px;
}

.add{background:#28a745;color:#fff}
.next{background:#007bff;color:#fff;width:100%}
.reset{background:red;color:#fff;width:100%}

.card{
background:#1b1b1b;
padding:10px;
margin:10px 0;
border-radius:10px;
}

.name{
font-size:18px;
font-weight:bold;
}

.total{
float:right;
font-size:18px;
}

.history{
margin-top:6px;
font-size:12px;
color:#aaa;
}

.badge{
display:inline-block;
padding:3px 6px;
margin:2px;
background:#333;
border-radius:6px;
}

.win{
text-align:center;
font-size:22px;
color:#ffd700;
margin:10px;
}
</style>

</head>

<body>

<header>🎲 Okey Skor Takip</header>

<div class="top">
Tur: <span id="round">1</span> / <span id="maxShow">5</span>
<br><br>

Toplam Tur:
<input id="max" type="number" value="5" style="width:60px">
<button onclick="setMax()">Ayarla</button>
</div>

<div class="container">

<input id="name" placeholder="Oyuncu adı">
<button class="add" onclick="add()">Ekle</button>

<div id="winner"></div>
<div id="list"></div>

<button class="next" onclick="nextRound()">▶ Tur Bitti</button>
<button class="reset" onclick="reset()">Sıfırla</button>

</div>

<script>

let players = [];
let round = 1;
let maxRound = 5;

function setMax(){
maxRound = parseInt(document.getElementById("max").value || 5);
render();
}

function add(){
let name = document.getElementById("name").value.trim();
if(!name) return;

players.push({
name:name,
score:0,
history:[]
});

document.getElementById("name").value="";
render();
}

function addScore(i){

let v = parseInt(prompt("Puan (+/-):"));
if(isNaN(v)) return;

players[i].score += v;
players[i].history.push(v);

render();
}

function nextRound(){

if(round >= maxRound){
finishGame();
return;
}

round++;
render();
}

function finishGame(){

let best = players[0];

for(let i=1;i<players.length;i++){
if(players[i].score < best.score){
best = players[i];
}
}

document.getElementById("winner").innerHTML =
"<div class='win'>🏆 Kazanan: "+best.name+"</div>";
}

function reset(){
players = [];
round = 1;
document.getElementById("winner").innerHTML="";
render();
}

function render(){

document.getElementById("round").innerText = round;
document.getElementById("maxShow").innerText = maxRound;

let html = "";

for(let i=0;i<players.length;i++){

let p = players[i];

let hist = "";

for(let j=0;j<p.history.length;j++){
hist += "<span class='badge'>"+(p.history[j]>0?"+":"")+p.history[j]+"</span>";
}

html += `
<div class="card">
<div>
<span class="name">${p.name}</span>
<span class="total">${p.score}</span>
</div>

<button onclick="addScore(${i})">Puan Ekle</button>

<div class="history">${hist}</div>
</div>
`;
}

document.getElementById("list").innerHTML = html;
}

render();

</script>

</body>
</html>
