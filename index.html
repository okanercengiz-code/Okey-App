<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okey Pro Final</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
h2{margin:0;padding:10px;background:#1c1c1c}
.top{padding:10px;background:#1c1c1c}
.container{padding:10px}
.card{background:#1b1b1b;padding:10px;margin:8px 0;border-radius:10px}
input{padding:8px;margin:3px;width:60%}
button{padding:6px;margin:3px;border:0;border-radius:6px}
.add{background:#28a745;color:#fff}
.next{background:#007bff;color:#fff;width:100%}
.reset{background:red;color:#fff;width:100%}
.name{font-size:18px;font-weight:bold}
.total{font-size:20px;float:right}
.history{
margin-top:6px;
font-size:12px;
color:#aaa;
white-space:nowrap;
overflow-x:auto;
}
.badge{
display:inline-block;
padding:3px 6px;
margin-right:4px;
border-radius:5px;
background:#333;
}
.win{
text-align:center;
font-size:22px;
margin:10px;
color:#ffd700;
}
</style>
</head>

<body>

<h2>🎲 Okey PRO FINAL</h2>

<div class="top">
Toplam Tur:
<input id="max" type="number" value="10" style="width:60px">
<button onclick="setMax()">Ayarla</button>
<br><br>
Tur: <span id="round">1</span> / <span id="maxShow">10</span>
</div>

<div class="container">

<input id="name" placeholder="Oyuncu adı">
<button class="add" onclick="add()">Ekle</button>

<div id="winner"></div>
<div id="list"></div>

<button class="next" onclick="next()">▶ Tur Bitti</button>
<button class="reset" onclick="reset()">Sıfırla</button>

</div>

<script>

let players=[];
let round=1;
let maxRound=10;
let gameOver=false;

function setMax(){
maxRound=parseInt(document.getElementById("max").value||10);
render();
}

function add(){
let n=document.getElementById("name").value.trim();
if(!n)return;

players.push({
name:n,
history:[],
total:0
});

document.getElementById("name").value="";
render();
}

function addScore(i){

if(gameOver)return;

let v=parseInt(prompt("Bu tur puanı (+/-):"));
if(isNaN(v))return;

players[i].history.push(v);
players[i].total += v;

render();
}

function next(){

if(gameOver)return;

if(round>=maxRound){
finishGame();
return;
}

round++;
render();
}

function finishGame(){

gameOver=true;

let best=players[0];

for(let i=1;i<players.length;i++){
if(players[i].total>best.total){
best=players[i];
}
}

document.getElementById("winner").innerHTML =
"<div class='win'>🏆 Kazanan: "+best.name+" 🎉</div>";

playSound();
render();
}

function playSound(){

let ctx = new (window.AudioContext || window.webkitAudioContext)();

let o = ctx.createOscillator();
let g = ctx.createGain();

o.type = "sine";
o.frequency.value = 600;

g.gain.value = 0.1;

o.connect(g);
g.connect(ctx.destination);

o.start();

setTimeout(()=>{o.stop()},800);
}

function reset(){
players=[];
round=1;
gameOver=false;
document.getElementById("winner").innerHTML="";
render();
}

function render(){

document.getElementById("round").innerText=round;
document.getElementById("maxShow").innerText=maxRound;

let html="";

for(let i=0;i<players.length;i++){
let p=players[i];

let hist="";

for(let j=0;j<p.history.length;j++){
let v=p.history[j];
hist += "<span class='badge'>" + (v>0?"+":"") + v + "</span>";
}

html+=
"<div class='card'>"+
"<div>"+
"<span class='name'>"+p.name+"</span>"+
"<span class='total'>"+p.total+"</span>"+
"</div>"+
"<div>"+
"<button onclick='addScore("+i+")'>Tur Puanı</button>"+
"</div>"+
"<div class='history'>"+hist+"</div>"+
"</div>";
}

document.getElementById("list").innerHTML=html;
}

render();

</script>

</body>
</html>
